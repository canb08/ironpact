name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run secret-scan
      - run: npm run size
      - run: npm audit --audit-level=high
        continue-on-error: true

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - name: Check Edge Functions
        run: deno check --no-config --no-lock supabase/functions/export/index.ts supabase/functions/health/index.ts supabase/functions/delete-account/index.ts
      - name: Verify database and function configuration
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path('supabase/config.toml').read_text())
          assert config['project_id'] == 'ironpact'
          assert config['db']['migrations']['enabled'] is True
          assert config['db']['seed']['enabled'] is True
          assert config['db']['seed']['sql_paths'] == ['./seed.sql']
          assert config['auth']['email']['otp_length'] == 6
          assert config['auth']['email']['otp_expiry'] == 600
          assert set(config['functions']) == {'export', 'health', 'delete-account'}
          for name in ('export', 'health', 'delete-account'):
              assert config['functions'][name]['verify_jwt'] is False, name
          PY
      - name: Start local database
        run: supabase db start
      - name: Apply migrations and seed on a clean local database
        run: supabase db reset --local --yes
      - name: Run database tests
        run: supabase test db
      - name: Start local Auth, API and function services
        run: |
          # Restart from a full stack: db start alone has no Auth or PostgREST.
          supabase stop --no-backup
          umask 077
          # Keep an isolated stack directory for CLI runtime state.
          python3 - <<'PY'
          import os
          import pathlib
          import shutil

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'a5-stack'
          shutil.copytree('supabase', root / 'supabase', ignore=shutil.ignore_patterns('.temp'))
          PY
          stack_root="$RUNNER_TEMP/a5-stack"
          supabase --workdir "$stack_root" start --exclude studio,imgproxy,postgres-meta,logflare,vector,supavisor,edge-runtime > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { grep -iE "error|fail|denied|invalid|unhealthy" "$RUNNER_TEMP/supabase-start.log" | grep -viE "key|secret|jwt" | head -40; exit 1; }
          supabase --workdir "$stack_root" functions serve > "$RUNNER_TEMP/supabase-functions.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/supabase-functions.pid"
      - name: Run Edge Function integration tests
        run: |
          umask 077
          supabase --workdir "$RUNNER_TEMP/a5-stack" status -o env > "$RUNNER_TEMP/supabase-status.env" 2> "$RUNNER_TEMP/supabase-status.log"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          export SUPABASE_URL="${SUPABASE_URL:-${API_URL:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export EXPORT_TEST_URL="$SUPABASE_URL/functions/v1/export"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_ANON_KEY"
          printf '::add-mask::%s\n' "$SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_ANON_KEY"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 "$SUPABASE_URL/functions/v1/health" | grep -qx ok; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo 'Local Edge Functions did not become ready.'
            exit 1
          fi
          deno test --no-config --no-lock --allow-env --allow-net --allow-read=tests/fixtures/export supabase/functions/export/index.test.ts
          deno test --no-config --no-lock --allow-env --allow-net --allow-run=psql supabase/functions/delete-account/index.test.ts
      - name: Run mock and Supabase Repo contracts and 20-set flight test
        run: |
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          export SUPABASE_URL="${SUPABASE_URL:-${API_URL:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_ANON_KEY"
          printf '::add-mask::%s\n' "$SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_ANON_KEY"
          npm ci
          RUN_SUPABASE_INTEGRATION=1 npx vitest run --coverage.enabled=false --reporter=verbose tests/unit/data/repo.mock.test.ts tests/integration/repo.supabase.test.ts
          RUN_SUPABASE_INTEGRATION=1 npx vitest run --coverage.enabled=false --reporter=verbose tests/integration/realtime.supabase.test.ts
      - name: Show local container status on failure
        if: failure()
        # Do not dump CLI output, environment or request logs: they may contain keys.
        run: docker ps --all --filter name=supabase_ --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
      - name: Stop local stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/supabase-functions.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/supabase-functions.pid")" 2>/dev/null || true
          fi
          # Teardown only: a container that fails to stop must not fail a green run (the runner is discarded anyway).
          supabase stop --no-backup || echo "::warning::supabase stop failed (ignored)"
          rm -f "$RUNNER_TEMP/supabase-status.env" "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/supabase-status.log" "$RUNNER_TEMP/supabase-functions.log" "$RUNNER_TEMP/supabase-functions.pid"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Playwright (iPhone 15 WebKit and Pixel 7 Chromium)
        run: npx playwright test
      - name: Upload visual snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: x11-visual-diffs
          path: |
            test-results/**/*-actual.png
            test-results/**/*-expected.png
            test-results/**/*-diff.png
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Measured budgets fail (H2 PR, ## Found). Keep the report, do not block merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production build (mock backend)
        run: npm run build
        env:
          VITE_BACKEND: mock
      - name: Lighthouse CI (vite preview is started by lhci)
        id: lhci
        continue-on-error: true
        run: npx --no-install lhci autorun
      - name: PWA installability
        id: installability
        if: success() || failure()
        run: |
          set -euo pipefail
          cleanup() { if [ -f "$RUNNER_TEMP/preview.pid" ]; then kill "$(cat "$RUNNER_TEMP/preview.pid")" 2>/dev/null || true; fi; }
          trap cleanup EXIT
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/preview.pid"
          ready=false
          for attempt in $(seq 1 40); do
            # Vite colours its banner, so poll the port instead of grepping "Local:".
            if curl -sf -o /dev/null "http://127.0.0.1:4173/"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "vite preview did not become ready"
            cat "$RUNNER_TEMP/preview.log"
            exit 1
          fi
          node --input-type=module << 'JS'
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';

          const require = createRequire(pathToFileURL(`${process.cwd()}/package.json`));
          const chromeLauncher = require('chrome-launcher');
          const puppeteer = await import('puppeteer-core');
          const urls = ['/install', '/', '/session', '/crew', '/settings'].map(
            (path) => `http://127.0.0.1:4173${path}`,
          );
          const chrome = await chromeLauncher.launch({
            chromePath: process.env.CHROME_PATH,
            chromeFlags: ['--headless=new', '--no-sandbox', '--disable-dev-shm-usage'],
          });
          const browser = await puppeteer.connect({ browserURL: `http://127.0.0.1:${chrome.port}` });
          const failures = [];
          try {
            for (const url of urls) {
              const page = await browser.newPage();
              await page.goto(url, { waitUntil: 'networkidle0', timeout: 30000 });
              const session = await page.createCDPSession();
              await session.send('Page.enable');
              const result = await session.send('Page.getInstallabilityErrors');
              const errors = result.installabilityErrors ?? [];
              console.log(JSON.stringify({ url, errors }));
              if (errors.length) failures.push({ url, errors });
              await page.close();
            }
          } finally {
            await browser.disconnect();
            await chrome.kill();
          }
          if (failures.length) {
            console.error(JSON.stringify({ failures }, null, 2));
            process.exit(1);
          }
          JS
      - name: Upload Lighthouse reports
        if: always() && (steps.lhci.outcome == 'failure' || steps.installability.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-ci
          path: .lighthouseci
          if-no-files-found: ignore

